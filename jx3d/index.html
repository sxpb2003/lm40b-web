function stripDarkFaces(mesh, keepBelowY){
  const mat = mesh.material; if (!mat || !mat.color) return 0;
  const sum = mat.color.r + mat.color.g + mat.color.b;
  if (sum > 0.5) return 0;
  const g = mesh.geometry; const pos = g.attributes.position;
  if (!pos) return 0;
  let idxArr;
  if (g.index) idxArr = g.index.array;
  else { const n = pos.count; idxArr = new Uint32Array(n); for (let i = 0; i < n; i++) idxArr[i] = i; }
  const keep = []; let removed = 0;
  for (let t = 0; t < idxArr.length; t += 3){
    const a = idxArr[t], b = idxArr[t+1], c = idxArr[t+2];
    const ax = pos.getX(a), ay = pos.getY(a), az = pos.getZ(a);
    const bx = pos.getX(b), by = pos.getY(b), bz = pos.getZ(b);
    const cx = pos.getX(c), cy = pos.getY(c), cz = pos.getZ(c);
    const ux = bx-ax, uy = by-ay, uz = bz-az;
    const vx = cx-ax, vy = cy-ay, vz = cz-az;
    const nx = uy*vz-uz*vy, ny = uz*vx-ux*vz, nz = ux*vy-uy*vx;
    const area = 0.5*Math.sqrt(nx*nx+ny*ny+nz*nz);
    const maxY = Math.max(ay, by, cy);
    if (area > 6 && maxY > keepBelowY){ removed++; continue; }
    keep.push(a, b, c);
  }
  if (removed && keep.length){ g.setIndex(keep); g.computeVertexNormals(); }
  return removed;
}
function stripAboveRoof(mesh, minY){
  const g = mesh.geometry, pos = g && g.attributes && g.attributes.position;
  if (!pos) return 0;
  let idxArr;
  if (g.index) idxArr = g.index.array;
  else { const n = pos.count; idxArr = new Uint32Array(n); for (let i = 0; i < n; i++) idxArr[i] = i; }
  const keep = []; let removed = 0;
  for (let t = 0; t < idxArr.length; t += 3){
    const a = idxArr[t], b = idxArr[t+1], c = idxArr[t+2];
    const ya = pos.getY(a), yb = pos.getY(b), yc = pos.getY(c);
    if (ya > minY && yb > minY && yc > minY){
      const ax = pos.getX(a), az = pos.getZ(a), bx = pos.getX(b), bz = pos.getZ(b), cx = pos.getX(c), cz = pos.getZ(c);
      const ux = bx-ax, uy = yb-ya, uz = bz-az, vx = cx-ax, vy = yc-ya, vz = cz-az;
      const nx = uy*vz-uz*vy, ny = uz*vx-ux*vz, nz = ux*vy-uy*vx;
      const area = 0.5*Math.sqrt(nx*nx+ny*ny+nz*nz);
      if (area > 0.05){ removed++; continue; }   // 高出屋面的孤立三角形（黑色尖刺）
    }
    keep.push(a, b, c);
  }
  if (removed && keep.length){ g.setIndex(keep); g.computeVertexNormals(); }
  return removed;
}
function removeNeedles(mesh){
  const g = mesh.geometry; if (!g || !g.attributes || !g.attributes.position) return 0;
  const pos = g.attributes.position;
  let idxArr;
  if (g.index) idxArr = g.index.array;
  else { const n = pos.count; idxArr = new Uint32Array(n); for (let i = 0; i < n; i++) idxArr[i] = i; }
  const triCount = idxArr.length / 3;
  const keep = [];
  let removed = 0;
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
  for (let t = 0; t < triCount; t++){
    const ia = idxArr[t*3], ib = idxArr[t*3+1], ic = idxArr[t*3+2];
    A.fromBufferAttribute(pos, ia); B.fromBufferAttribute(pos, ib); C.fromBufferAttribute(pos, ic);
    const e1 = A.distanceTo(B), e2 = B.distanceTo(C), e3 = C.distanceTo(A);
    const mx = Math.max(e1, e2, e3), mn = Math.min(e1, e2, e3);
    // 细长/退化三角形（压缩后常见的黑色尖刺）
    if ((mx > 3 && mn < 0.03) || (mx > 1 && mx / Math.max(mn, 1e-6) > 400)){ removed++; continue; }
    keep.push(ia, ib, ic);
  }
  if (removed > 0 && keep.length){
    g.setIndex(keep);
    g.computeVertexNormals();
  }
  return removed;
}

const loader = new GLTFLoader();
const draco = new DRACOLoader(); draco.setDecoderPath('./lib/draco/'); loader.setDRACOLoader(draco);
const M = {
  nei_done: new THREE.MeshStandardMaterial({ color: 0x1857c9, roughness: .85 }),
  nei_ing:  new THREE.MeshStandardMaterial({ color: 0x8ede6a, roughness: .85 }),
  wai_done: new THREE.MeshStandardMaterial({ color: 0xe01b1b, roughness: .85 }),
  wai_ing:  new THREE.MeshStandardMaterial({ color: 0xf2c200, roughness: .85 }),
  none:     new THREE.MeshStandardMaterial({ color: 0x9e9e9e, roughness: .9 }),
  roof_done: new THREE.MeshStandardMaterial({ color: 0x6b4f2a, roughness: .9 }),
  roof_ing:  new THREE.MeshStandardMaterial({ color: 0xc9a227, roughness: .9 })
};
const glbCache = {};
function loadGLB(name){ return glbCache[name] ||= new Promise((res, rej) => loader.load('./assets/'+name+'.glb', g => res(g), undefined, rej)); }
function makeLabel(text){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.font = 'bold 110px "Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 14; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.strokeText(text,128,128);
  ctx.fillStyle = '#ffd34d'; ctx.fillText(text,128,128);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));

}
window.progressData = {}; window.floorsData = {};
const buildings = [];
const GLASS_RE = /glass|透明|窗|幕墙|玻璃/i;
function maxFloorOf(b){
  const pd = progressData[b] || {nei:{}, wai:{}};
  let mx = 0;
  for (const k of Object.keys(pd.nei)) mx = Math.max(mx, parseInt(k,10)||0);
  for (const k of Object.keys(pd.wai)) mx = Math.max(mx, parseInt(k,10)||0);
  return mx || 1;
}
function floorOf(b, y){
  const bd = buildings.find(x => x.name === b);
  const lv = (floorsData[b] || []).slice().sort((a,c)=>a-c);
  const N = maxFloorOf(b);
  if (lv.length >= 3){
    let k = 1;
    for (const l of lv) if (y >= l - 0.8) k++;
    return Math.min(N, Math.max(1, k - 1));
  }
  // 回退：按楼高均分 N 层
  if (!bd) return 1;
  const t = (y - bd.box.min.y) / Math.max(1e-6, (bd.box.max.y - bd.box.min.y));
  return Math.min(N, Math.max(1, Math.ceil(t * N)));
}
let roofData = window.roofData || {};
function isRoof(b, y){
  const lv = (floorsData[b] || []).slice().sort((a,c)=>a-c);
  if (!lv.length) return false;
  const top = lv[lv.length - 1];
  return y >= top - 2.5;
}
function applyMode(m){
  for (const b of buildings){
    const pd = progressData[b.name] || { nei:{}, wai:{} };
    for (const it of b.meshes){
      const nm = (it.orig && it.orig.name) || '';
      const isGlass = GLASS_RE.test(nm);
      if (m === 'orig' || isGlass){ it.mesh.material = it.orig; continue; }
      const box = new THREE.Box3().setFromObject(it.mesh);
      const y = (box.min.y + box.max.y) / 2;
      if (isRoof(b.name, y)){
        if (m.startsWith('roof')){
          const rd = roofData[b.name] || {};
          const key = m === 'rooffs' ? 'fangshui' : (m === 'roofbh' ? 'baohu' : 'guawa');
          const st = rd[key] || '—';
          if (m === 'roofgw'){
            // 挂瓦：只染已完成的，没挂瓦的保持原始外观
            it.mesh.material = (st === '完成') ? M.roof_done : it.orig;
          } else {
            it.mesh.material = st === '完成' ? M.roof_done : (st === '施工中' ? M.roof_ing : it.orig);
          }
        } else it.mesh.material = it.orig;
        continue;
      }
      if (m.startsWith('roof')){ it.mesh.material = it.orig; continue; }
      const f = floorOf(b.name, y);
      const st = (m === 'nei' ? pd.nei : pd.wai)[String(f)] || '';
      if (st === '完成') it.mesh.material = (m === 'nei' ? M.nei_done : M.wai_done);
      else if (st === '施工中') it.mesh.material = (m === 'nei' ? M.nei_ing : M.wai_ing);

const ZONES = {
  '一工区': ['26','27','28','35','42','51','S10','S11','S5'],
  '二工区': ['29','30','36','37','43','44','52','S12'],
  '三工区': ['31','38','45','46','53','54','55','S13']
};
function zoneStats(){
  const rows = [];
  for (const [z, list] of Object.entries(ZONES)){
    let neiDone = 0, neiTot = 0, waiDone = 0, waiTot = 0, fsDone = 0, bhDone = 0, gwDone = 0, bTot = 0;
    let fsDen = 0, bhDen = 0, gwDen = 0;
    for (const b of list){
      const pd = progressData[b]; if (!pd) continue;
      for (const st of Object.values(pd.nei || {})) { neiTot++; if (st === '完成') neiDone++; }
      for (const st of Object.values(pd.wai || {})) { waiTot++; if (st === '完成') waiDone++; }
      const rd = (window.roofData || {})[b] || {};
      bTot++;
      fsDen++; if (rd.fangshui === '完成') fsDone++;
      bhDen++; if (rd.baohu === '完成' && rd.fangshui === '完成') bhDone++;
      gwDen++; if (rd.guawa === '完成' && rd.baohu === '完成') gwDone++;

  for (const r of rows) html += '<tr><td>' + r[0] + '</td><td>' + r[1] + '%</td><td>' + r[2] + '%</td><td>' + r[3] + '%</td><td>' + r[4] + '%</td><td>' + r[5] + '%</td></tr>';

  fetch('./buildings.json').then(r=>r.json()),
  fetch('./progress.json').then(r=>r.json()),
  fetch('./floors.json').then(r=>r.json()),

  function placeCamera(){
    const vfov = camera.fov * Math.PI / 180;
    const hfov = 2 * Math.atan(Math.tan(vfov/2) * camera.aspect);

const BB = new THREE.Box3();
  for (const b of buildings) BB.expandByObject(b.root);

  };

  controls.enablePan = isMobileLike;

    const vfov = camera.fov * Math.PI / 180;

    const minHalf = Math.min(vfov, hfov) / 2;
    const fitK = camera.aspect < 0.8 ? 0.80 : 1.02;

const CYCLE = ['nei', 'wai', 'rooffs', 'roofgw'];

function clampPan(){
  const P = window.PAN, t = controls.target;
  if (!P) return;
  const cx = Math.min(P.maxX, Math.max(P.minX, t.x));
  const cy = Math.min(P.maxY, Math.max(P.minY, t.y));
  const cz = Math.min(P.maxZ, Math.max(P.minZ, t.z));
  if (cx !== t.x || cy !== t.y || cz !== t.z){
    camera.position.x += cx - t.x;
    camera.position.y += cy - t.y;
    camera.position.z += cz - t.z;
    t.set(cx, cy, cz);
  }
}
(function loop(){ requestAnimationFrame(loop); controls.update(); clampPan(); renderer.render(scene, camera); })();
